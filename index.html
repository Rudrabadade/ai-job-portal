<!DOCTYPE html>
<html>

<head>
<title>Register</title>

<style>

body{
font-family:Arial;
padding:30px;
background:#f5f7fa;
text-align:center;
}

input,select{

display:block;
margin:15px auto;
padding:10px;
width:300px;
border-radius:8px;
border:1px solid #ccc;

}

button{

padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#4CAF50;
color:white;

}

</style>

</head>

<body>

<h1>Register</h1>

<input
type="text"
id="full_name"
placeholder="Full Name"
>

<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<select id="role">

<option value="Job Seeker">
Job Seeker
</option>

<option value="Recruiter">
Recruiter
</option>

</select>

<button onclick="register()">
Register
</button>

<script>

async function register(){

try{

const formData=new FormData();

formData.append(
"full_name",
document.getElementById(
"full_name"
).value
);

formData.append(
"email",
document.getElementById(
"email"
).value
);

formData.append(
"password",
document.getElementById(
"password"
).value
);

formData.append(
"role",
document.getElementById(
"role"
).value
);

const response=
await fetch(
"http://127.0.0.1:8000/register",
{
method:"POST",
body:formData
}
);

const data=
await response.json();

alert(data.message);

window.location.href=
"login.html";

}

catch(error){

console.log(error);

alert(
"Registration Failed"
);

}

}

</script>

</body>

</html>
