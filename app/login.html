<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<style>

body{

font-family:Arial;
padding:30px;
background:#f5f7fa;
text-align:center;

}

input{

display:block;
margin:15px auto;
padding:10px;
width:300px;
border-radius:8px;
border:1px solid #ccc;

}

button{

padding:10px 20px;
border:none;
border-radius:8px;
cursor:pointer;
background:#4CAF50;
color:white;

}

button:hover{

opacity:0.9;

}

</style>

</head>

<body>

<h1>

Login

</h1>

<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="login()">

Login

</button>

<script>

async function login(){

try{

const formData =
new FormData();

formData.append(
"email",
document.getElementById(
"email"
).value
);

formData.append(
"password",
document.getElementById(
"password"
).value
);

const response =
await fetch(

"/login",

{

method:"POST",

body:formData

}

);

const data =
await response.json();

if(data.user_id){

localStorage.setItem(
"user_id",
data.user_id
);

localStorage.setItem(
"full_name",
data.full_name
);

localStorage.setItem(
"role",
data.role
);

alert(
"Login successful"
);

if(data.role==="Recruiter"){

window.location.href=
"recruiter_dashboard.html";

}

else{

window.location.href=
"jobseeker_dashboard.html";

}

}

else{

alert(
data.message
);

}

}

catch(error){

console.log(error);

alert(
"Login failed"
);

}

}

</script>

</body>

</html>
