<!DOCTYPE html>
<html>

<head>

<title>Job Seeker Dashboard</title>

<style>

body{

font-family:Arial,sans-serif;
padding:30px;
margin:0;
background:linear-gradient(
135deg,
#eef2f7,
#dfe9f3
);

}

h1{

margin:0;
color:#222;
font-size:38px;

}

.top-bar{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;

}

.dashboard-title{

display:flex;
flex-direction:column;

}

.dashboard-title span{

color:#666;
font-size:14px;
margin-top:5px;

}

#jobs{

display:grid;
grid-template-columns:repeat(
auto-fit,
minmax(350px,1fr)
);

gap:25px;

}

.job-card{

background:white;
padding:25px;
border-radius:18px;
box-shadow:0px 6px 15px rgba(
0,
0,
0,
0.1
);

transition:0.3s;

}

.job-card:hover{

transform:translateY(-8px);

}

.job-card h2{

margin-bottom:15px;
color:#222;

}

.job-card p{

color:#555;
line-height:1.6;

}

button{

padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
background:#4CAF50;
color:white;
margin-top:10px;
font-size:15px;
font-weight:bold;
transition:0.3s;

}

button:hover{

transform:scale(1.05);

}

.logout-btn{

background:#f44336;

}

.upload-box{

margin-top:20px;
padding:15px;
background:#f5f7fa;
border-radius:12px;
border:2px dashed #ddd;

}

input[type="file"]{

margin-top:10px;
width:100%;

}

.apply-btn{

width:100%;

}

</style>

</head>

<body>

<div class="top-bar">

<div class="dashboard-title">

<h1>Available Jobs</h1>

<span>
Find jobs and upload your resume
</span>

</div>

<button
class="logout-btn"
onclick="logout()">

Logout

</button>

</div>

<div id="jobs"></div>

<script src="static/js/jobseeker_dashboard.js"></script>

</body>

</html>
